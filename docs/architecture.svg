<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="500" viewBox="0 0 1290 500" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Fraud detection platform: data flow from the transaction stream to the scoring service and back through monitoring to the registry</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .node rect { fill: #f2f2f2; stroke: #333; stroke-width: 1.2; }
    .node.external rect { fill: #ffffff; stroke-dasharray: 5 4; }
    .node.emphasis rect { fill: #ffd166; stroke: #8a5a00; stroke-width: 1.6; }
    .node text { fill: #111; text-anchor: middle; }
    .edge { fill: none; stroke: #333; stroke-width: 1.2; marker-end: url(#arrow); }
    .label { fill: #333; font-size: 11px; }
  </style>

  <!-- row A: the offline path -->
  <g class="node" data-node="Transaction stream">
    <rect x="20" y="40" width="180" height="70" rx="6"/>
    <text x="110" y="70">Transaction stream</text>
    <text x="110" y="88" class="label">raw rows, chronological</text>
  </g>
  <g class="node" data-node="Chronological split and train-only guard">
    <rect x="280" y="40" width="180" height="70" rx="6"/>
    <text x="370" y="70">Chronological split</text>
    <text x="370" y="88">and train-only guard</text>
  </g>
  <g class="node" data-node="Preparation pipeline">
    <rect x="540" y="40" width="180" height="70" rx="6"/>
    <text x="630" y="70">Preparation pipeline</text>
    <text x="630" y="88" class="label">fitted on the training window</text>
  </g>
  <g class="node" data-node="Training and evaluation">
    <rect x="800" y="40" width="180" height="70" rx="6"/>
    <text x="890" y="70">Training and evaluation</text>
    <text x="890" y="88" class="label">family, stack, threshold, bands</text>
  </g>
  <g class="node emphasis" data-node="Model registry">
    <rect x="1060" y="40" width="180" height="70" rx="6"/>
    <text x="1150" y="70">Model registry</text>
    <text x="1150" y="88" class="label">alias production: source of truth</text>
  </g>

  <!-- row B: the online path -->
  <g class="node" data-node="Point-in-time feature build">
    <rect x="20" y="190" width="180" height="70" rx="6"/>
    <text x="110" y="220">Point-in-time</text>
    <text x="110" y="238">feature build</text>
  </g>
  <g class="node" data-node="Parity test">
    <rect x="280" y="190" width="180" height="70" rx="6"/>
    <text x="370" y="220">Parity test</text>
    <text x="370" y="238" class="label">batch rows equal online rows</text>
  </g>
  <g class="node" data-node="Online feature store">
    <rect x="540" y="190" width="180" height="70" rx="6"/>
    <text x="630" y="220">Online feature store</text>
    <text x="630" y="238" class="label">Redis or in-process, per key</text>
  </g>
  <g class="node" data-node="Scoring service">
    <rect x="800" y="190" width="180" height="70" rx="6"/>
    <text x="890" y="220">Scoring service</text>
    <text x="890" y="238" class="label">POST /score</text>
  </g>
  <g class="node external" data-node="Client">
    <rect x="1060" y="190" width="180" height="70" rx="6"/>
    <text x="1150" y="220">Client</text>
    <text x="1150" y="238" class="label">authorisation flow (external)</text>
  </g>

  <!-- row C: monitoring and the lifecycle -->
  <g class="node" data-node="Drift job">
    <rect x="280" y="340" width="180" height="70" rx="6"/>
    <text x="370" y="370">Drift job</text>
    <text x="370" y="388" class="label">PSI per column and score, no labels</text>
  </g>
  <g class="node" data-node="Retrain gate">
    <rect x="540" y="340" width="180" height="70" rx="6"/>
    <text x="630" y="370">Retrain gate</text>
    <text x="630" y="388" class="label">challenger fit, paired bootstrap</text>
  </g>
  <g class="node" data-node="Decay job">
    <rect x="800" y="340" width="180" height="70" rx="6"/>
    <text x="890" y="370">Decay job</text>
    <text x="890" y="388" class="label">PR-AUC on matured batches</text>
  </g>
  <g class="node external" data-node="Chargeback process">
    <rect x="1060" y="340" width="180" height="70" rx="6"/>
    <text x="1150" y="370">Chargeback process</text>
    <text x="1150" y="388" class="label">labels arrive weeks later (external)</text>
  </g>

  <!-- row A edges -->
  <path class="edge" d="M 200 75 L 280 75"/>
  <path class="edge" d="M 460 75 L 540 75"/>
  <path class="edge" d="M 720 75 L 800 75"/>
  <path class="edge" d="M 980 75 L 1060 75"/>
  <text class="label" x="1020" y="68" text-anchor="middle">bundle</text>

  <!-- stream to feature build; feature build to training and to parity -->
  <path class="edge" d="M 110 110 L 110 190"/>
  <path class="edge" d="M 170 190 L 170 150 L 890 150 L 890 110"/>
  <text class="label" x="530" y="145" text-anchor="middle">features, strictly before each row</text>
  <path class="edge" d="M 200 225 L 280 225"/>
  <path class="edge" d="M 540 225 L 460 225"/>

  <!-- registry to service -->
  <path class="edge" d="M 1150 110 L 1150 160 L 940 160 L 940 190"/>
  <text class="label" x="1045" y="155" text-anchor="middle">loads the alias</text>

  <!-- service and store, both directions labelled -->
  <path class="edge" d="M 800 212 L 720 212"/>
  <text class="label" x="760" y="183" text-anchor="middle">get_features, then commit</text>
  <path class="edge" d="M 720 240 L 800 240"/>
  <text class="label" x="760" y="278" text-anchor="middle">feature vector</text>

  <!-- client and service, both directions labelled -->
  <path class="edge" d="M 1060 212 L 980 212"/>
  <text class="label" x="1020" y="183" text-anchor="middle">request</text>
  <path class="edge" d="M 980 240 L 1060 240"/>
  <text class="label" x="1020" y="278" text-anchor="middle">score, band, factors</text>

  <!-- scored batches to the two monitoring jobs -->
  <path class="edge" d="M 830 260 L 830 300 L 370 300 L 370 340"/>
  <text class="label" x="600" y="295" text-anchor="middle">scored batch, at each batch close</text>
  <path class="edge" d="M 940 260 L 940 340"/>
  <text class="label" x="948" y="305">scores</text>

  <!-- labels from the chargeback process -->
  <path class="edge" d="M 1060 375 L 980 375"/>
  <text class="label" x="1020" y="368" text-anchor="middle">matured labels</text>
  <path class="edge" d="M 1150 410 L 1150 440 L 650 440 L 650 410"/>
  <text class="label" x="900" y="455" text-anchor="middle">matured labels for the challenger fit</text>

  <!-- the two jobs into the gate, the gate into the registry -->
  <path class="edge" d="M 460 375 L 540 375"/>
  <text class="label" x="500" y="368" text-anchor="middle">drift flag</text>
  <path class="edge" d="M 800 375 L 720 375"/>
  <text class="label" x="760" y="368" text-anchor="middle">decay flag</text>
  <path class="edge" d="M 600 410 L 600 470 L 1270 470 L 1270 75 L 1240 75"/>
  <text class="label" x="935" y="486" text-anchor="middle">promote or roll back: move the alias</text>
</svg>
