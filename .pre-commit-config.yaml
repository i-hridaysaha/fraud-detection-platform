repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy on src
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest -q
        language: system
        types: [python]
        pass_filenames: false

      - id: no-em-dash
        name: no em dashes
        entry: scripts/check_no_em_dash.sh
        language: system
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
